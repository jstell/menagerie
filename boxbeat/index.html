<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxbeat</title>
    <meta
      name="description"
      content="Stack mouth-made loops into a beat at a cartoon 1980s block party."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffd23f'/%3E%3Cellipse cx='16' cy='18' rx='7' ry='9' fill='%2314100f'/%3E%3Cellipse cx='16' cy='15' rx='4' ry='3' fill='%23ff2e88'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-CiETUXVS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-c0RoPUDR.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Boxbeat</h1>
        <p class="tagline">Every sound is a mouth.</p>
      </header>

      <!-- Which era of the block you are standing on. Filled in from the
           scene registry, so it never disagrees with what is loadable. -->
      <div id="eras" class="eras" role="group" aria-label="Choose an era"></div>

      <!-- The street. Dusk sits underneath; night fades in as the mix fills. -->
      <div id="street" class="street">
        <div id="scene-dusk" class="scene" aria-hidden="true"></div>
        <div id="scene-night" class="scene night" aria-hidden="true"></div>
        <div class="lamp-glow" aria-hidden="true"></div>
        <div id="stage" class="stage"></div>
      </div>

      <div id="beats" class="beat-strip" aria-hidden="true"></div>

      <div class="controls">
        <button id="surprise" class="button primary" type="button">
          Surprise me
        </button>
        <button id="share" class="button" type="button" disabled>
          Copy link to this mix
        </button>
        <button id="mute" class="button quiet" type="button" aria-pressed="false">
          Mute
        </button>
      </div>

      <p id="tray-hint" class="tray-hint">Drag a layer onto anyone — every voice sounds different.</p>

      <div id="tray" class="tray"></div>

      <footer>
        <p id="status" class="status"></p>
      </footer>
    </main>

  </body>
</html>
