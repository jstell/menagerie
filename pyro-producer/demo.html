<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyro Producer — effect engine</title>
<style>
  :root{--ink:#eef2ff;--muted:#8391b8;--line:#1b2340;--ember:#f5b942}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#03040a;color:var(--ink);overflow:hidden;
    font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{position:relative;height:100vh}
  #sky{display:block;width:100%;height:100%}
  .panel{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 18px;
    background:linear-gradient(180deg,rgba(3,4,10,0),rgba(3,4,10,.82) 40%);z-index:2}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
  button{font-family:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
    background:#101a34;border:1px solid var(--line);padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:600;transition:.15s}
  button:hover{background:#18254a}
  button.go{background:linear-gradient(180deg,#ffca5a,#f0a832);color:#2a1a00;border:none;font-size:13px;padding:12px 26px}
  button.go:hover{filter:brightness(1.06)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;border-radius:0;background:#0c1428;padding:9px 13px}
  .seg button.active{background:#22335f;color:#fff}
  .swatches{display:flex;gap:7px}
  .sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.12s;box-shadow:0 0 8px currentColor}
  .sw.active{border-color:#fff;transform:scale(1.12)}
  label.small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  input[type=range]{width:120px;accent-color:var(--ember)}
  .chk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.05em;cursor:pointer}
  .hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);z-index:2;text-align:center}
  .hud{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ember);z-index:2;text-align:center;font-weight:600;min-height:20px;
    text-shadow:0 0 12px rgba(245,185,66,.35)}
  button.show{background:linear-gradient(180deg,#7fb2ff,#4a7fe0);color:#04122e;border:none;font-size:13px;padding:12px 22px}
  button.show:hover{filter:brightness(1.06)}
  button.show:disabled{filter:saturate(.3) brightness(.7);cursor:default}
  .caption{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;letter-spacing:.03em}
  .caption b{color:var(--ember);font-weight:600}
</style>
  <script type="module" crossorigin src="./assets/demo-1GvN8h13.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/library--yenoGR3.js">
  <link rel="modulepreload" crossorigin href="./assets/textures-BK4KnsI5.js">
  <link rel="modulepreload" crossorigin href="./assets/renderer-8qP5s0P4.js">
</head>
<body>
<div id="wrap">
  <canvas id="sky"></canvas>
  <div class="hint">Pyro Producer · data-driven effect engine · tap the sky or press Launch · <a href="/designer.html" style="color:var(--ember)">timeline designer →</a></div>
  <div class="hud" id="showHud"></div>
  <div class="panel">
    <div class="row">
      <div class="seg" id="typeSeg"></div>
      <div class="swatches" id="swatches"></div>
      <label class="small">Size</label>
      <input type="range" id="size" min="0" max="2" step="1" value="1">
      <button class="go" id="launch">✦ Launch</button>
      <button class="go show" id="playShow">▶ Show</button>
      <label class="chk"><input type="checkbox" id="sound" checked> sound</label>
    </div>
    <div class="caption">Every effect is <b>JSON</b> fed to one engine. <b>▶ Show</b> plays a tagged track — shells trigger early, on real physics, so every <b>peak lands on its beat</b>; the first ones rise during the count-in.</div>
  </div>
</div>
</body>
</html>
